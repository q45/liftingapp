# Android Gradle config.
#
# Defaults aimed at fast incremental builds on a laptop.

# JVM args -- generous heap for Kotlin compilation; -XX:MaxMetaspaceSize
# avoids OOM-Metaspace on long Compose builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Parallel project builds + on-demand evaluation. Helps Studio sync time.
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

# AndroidX (modern). Jetifier OFF -- we don't depend on legacy support libs.
android.useAndroidX=true
android.enableJetifier=false

# Kotlin compiler: use new Compose-friendly defaults.
kotlin.code.style=official
kotlin.incremental=true

# Non-transitive R classes -- smaller incremental builds, recommended
# for app modules.
android.nonTransitiveRClass=true
