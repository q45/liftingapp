# Version catalog. Single source of truth for dependency versions.
# Keeps every build.gradle.kts free of literal version strings so a
# bump only happens in one place.

[versions]
# Tooling
agp                = "8.13.2"
kotlin             = "2.0.20"
ksp                = "2.0.20-1.0.25"

# Compose
composeBom         = "2024.09.03"
activityCompose    = "1.9.2"
navigationCompose  = "2.8.1"

# AndroidX core
coreKtx            = "1.13.1"
lifecycle          = "2.8.6"

# Room (local DB)
room               = "2.6.1"

# Networking
ktor               = "2.3.12"
serialization      = "1.7.3"
coroutines         = "1.9.0"

# Storage / settings
datastore          = "1.1.1"
securityCrypto     = "1.1.0-alpha06"

# Auth
credentials        = "1.3.0"
googleId           = "1.1.1"

# Charts
vico               = "2.0.0-beta.4"

[libraries]
# Compose BOM controls all compose-bom-aligned versions transitively.
compose-bom        = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3  = { module = "androidx.compose.material3:material3" }
compose-ui         = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-runtime    = { module = "androidx.compose.runtime:runtime" }

activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-core-ktx  = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

room-runtime       = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx           = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler      = { module = "androidx.room:room-compiler", version.ref = "room" }

ktor-client-core   = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

datastore-preferences      = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
security-crypto            = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

credentials                       = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services-auth    = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid                          = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }

vico-compose-m3    = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

[plugins]
android-application      = { id = "com.android.application", version.ref = "agp" }
kotlin-android           = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose           = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                      = { id = "com.google.devtools.ksp", version.ref = "ksp" }
